# Where the research has informed policy (from CV), most visible first.
- who: "Virginia Joint Commission on Technology & Science"
  what: "BQT+ data informed the affordability benchmarks in “Beyond Access: Broadband Affordability & Adoption” (co-author), Nov 2025."
  url: "https://dls.virginia.gov/commissions/jcots/materials/broadband_report_nov_2025.pdf"
- who: "NYC Office of Technology & Innovation"
  what: "BQT+ address-level availability and affordability analysis informed the City’s Internet Access and Adoption Plan and its fiscal-impact assessment."
- who: "California Public Advocates Office, CPUC"
  what: "Contributed BQT pricing data to “Broadband Competition and Pricing Strategies in California’s Urban Markets” (2026), whose analysis found over $1B per year in potential consumer savings."
  url: "https://www.publicadvocates.cpuc.ca.gov/-/media/cal-advocates-website/files/press-room/reports-and-analyses/260114-public-advocates-broadband-competition-and-pricing-strategies-in-california-urban-markets.pdf"
